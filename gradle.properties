# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mod properties
mod_id=framedblocks_fabric
mod_version=10.5.3-fabric.1

# Fabric properties
minecraft_version=1.21.1
loader_version=0.19.5
fabric_api_version=0.116.17+1.21.1
loom_version=1.18.4
parchment_version=2024.11.17

# Dependency properties
forgeconfigapiport_version=21.1.6

# Set to true to additionally run JEI, EMI, REI and Jade in the dev client (or a comma-separated subset, e.g. jei,jade).
# Sodium is only included when listed explicitly (e.g. sodium or jei,sodium), true does not include it
compat_runtime=false

# Optional integrations
jei_mc_version=1.21.1
jei_version=19.64.0.453
# MezzConfig (net.mezzdev.config, published on the JEI maven), required at runtime by JEI 19.64 (mezz_config >=0.6.3), only used for the compat_runtime dev client
mezz_config_version=0.6.8
rei_version=16.0.799
emi_mc_version=1.21.1
emi_version=1.1.24
jade_version=15.10.6+fabric
athena_mc_version=1.21.1
athena_version=4.0.6
diag_blocks_version=21.1.2
amendments_version=cFt8Z1aS
searchables_mc_version=1.21.1
searchables_version=1.0.2
# Modrinth version id of Additional Placements Fabric 3.0.1.1 for 1.21.1 (the plain version number is shared by several Minecraft versions)
additionalplacements_version=h7HWO0Ez
atlasviewer_version=9.2.0
# Team Reborn Energy 4.1.0 is the build for Minecraft 1.21 and 1.21.1 (4.2.0 and newer require 1.21.5+)
team_reborn_energy_version=4.1.0
# Sodium, only used for the compat_runtime dev client. Modrinth version number of Sodium 0.8.13 for 1.21.1 Fabric
sodium_version=mc1.21.1-0.8.13-fabric
