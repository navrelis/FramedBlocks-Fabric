# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mod properties
mod_id=framedblocks_fabric
mod_version=1.0.0+mc1.20.1

# Fabric properties
minecraft_version=1.20.1
loader_version=0.19.5
fabric_api_version=0.92.12+1.20.1
loom_version=1.18.4
parchment_version=2023.09.03

# Dependency properties
forgeconfigapiport_version=8.0.3

# Set to true to additionally run JEI, EMI, REI and Jade in the dev client (or a comma-separated subset, e.g. jei,jade).
# Sodium is only included when listed explicitly (e.g. sodium or jei,sodium), true does not include it.
# Sodium 0.5.x has no Fabric Rendering API support, listing sodium therefore also adds Indium
compat_runtime=false

# Optional integrations
jei_mc_version=1.20.1
jei_version=15.71.0.224
rei_version=12.1.785
# Architectury and Cloth Config, required at runtime by REI 12.x, only used for the compat_runtime dev client
architectury_version=9.2.14
cloth_config_version=11.1.136
emi_mc_version=1.20.1
emi_version=1.1.24
jade_version=11.13.3+fabric
# Supplementaries and Moonlight (Moonlight is only needed if the Supplementaries classes referenced by the integration require it)
supplementaries_version=1.20-3.1.44-fabric
moonlight_version=1.20-2.16.37-fabric
# Diagonal Fences and Diagonal Windows for Fabric 1.20.1 (Modrinth version numbers)
diagonal_fences_version=v8.1.5-1.20.1-Fabric
diagonal_windows_version=v8.1.5-1.20.1-Fabric
# Team Reborn Energy 3.0.0 is the build for Minecraft 1.20.1
team_reborn_energy_version=3.0.0
# Sodium 0.5.13 has no Fabric Rendering API support, Indium provides it. Modrinth version numbers for Fabric 1.20.1
sodium_version=mc1.20.1-0.5.13-fabric
indium_version=1.0.36+mc1.20.1
