plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = mod_version
group = 'xfacthd.framedblocks'

base {
    archivesName = 'FramedBlocksFabric'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// Set showcase=true to make the clientTest run build the showcase scenes and save screenshots for the project page
// instead of running the smoke test. Optional: showcase_only=hero_cottage,glow_night limits the shots, showcase_variants=true
// additionally saves alternative camera angles of every shot to a debug folder
var showcaseRun = findProperty('showcase')?.toString()?.toLowerCase() == 'true'
var showcaseOnly = findProperty('showcase_only')?.toString() ?: ''
var showcaseVariants = findProperty('showcase_variants')?.toString()?.toLowerCase() == 'true'

loom {
    accessWidenerPath = file('src/main/resources/framedblocks_fabric.accesswidener')

    runs {
        // runClient only loads the main mod, this additionally loads the game test mod including the self-test and /fbtest commands
        clientDev {
            inherit client
            source 'gametest'
            ideConfigGenerated true
        }

        // Automated client smoke test, run via the runClientTest task. Only active with the framedblocks.clienttest property
        // set, never part of the build. Use -Pcompat_runtime=sodium to run it with Sodium instead of Indigo
        clientTest {
            inherit client
            source 'gametest'
            runDir 'run/clienttest'
            vmArg '-Dframedblocks.clienttest=true'
            if (showcaseRun)
            {
                vmArg '-Dframedblocks.clienttest.showcase=true'
                if (!showcaseOnly.isEmpty())
                {
                    vmArg "-Dframedblocks.clienttest.showcase.only=${showcaseOnly}"
                }
                if (showcaseVariants)
                {
                    vmArg '-Dframedblocks.clienttest.showcase.variants=true'
                }
            }
            programArg '--width'
            programArg showcaseRun ? '1920' : '1600'
            programArg '--height'
            programArg showcaseRun ? '1080' : '900'
            ideConfigGenerated false
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'framedblocks_fabric_gametest'
        enableGameTests = true
        enableClientGameTests = false
    }
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'Fuzs Mod Resources'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        content {
            includeGroupByRegex('fuzs.*')
        }
    }
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup('mezz.jei')
            includeGroup('net.mezzdev.config')
        }
    }
    maven {
        name = "Shedaniel's maven"
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroupAndSubgroups('me.shedaniel')
        }
    }
    maven {
        name = 'Architectury maven'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup('dev.architectury')
        }
    }
    maven {
        name = 'TerraformersMC maven'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup('dev.emi')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth maven'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    include "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    // Upstream uses javax.annotation.Nullable in 35 files, Forge provided jsr305 transitively, Minecraft 1.20.1 does not. Compile time only
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // Optional integrations, none of these are required at runtime
    modCompileOnly "mezz.jei:jei-${jei_mc_version}-fabric-api:${jei_version}"

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}"

    modCompileOnly "dev.emi:emi-fabric:${emi_version}+${emi_mc_version}:api"

    modCompileOnly "maven.modrinth:jade:${jade_version}"

    modCompileOnly("maven.modrinth:supplementaries:${supplementaries_version}") { transitive = false }
    modCompileOnly("maven.modrinth:moonlight:${moonlight_version}") { transitive = false }

    modCompileOnly("maven.modrinth:diagonal-fences:${diagonal_fences_version}") { transitive = false }
    modCompileOnly("maven.modrinth:diagonal-windows:${diagonal_windows_version}") { transitive = false }

    modCompileOnly "teamreborn:energy:${team_reborn_energy_version}"

    // Only for the game tests of the Team Reborn Energy integration, never bundled or part of the main runtime
    modGametestImplementation "teamreborn:energy:${team_reborn_energy_version}"

    // Set compat_runtime=true to run JEI, EMI, REI and Jade in the dev client, or a comma-separated subset (e.g. jei,jade).
    // Sodium is not part of "true" and has to be requested explicitly (e.g. sodium or jei,sodium).
    // Sodium 0.5.x on 1.20.1 does not implement the Fabric Rendering API, so requesting sodium also adds Indium
    var compatRuntime = findProperty('compat_runtime')?.toString()?.toLowerCase() ?: 'false'
    var compatRuntimeAll = compatRuntime == 'true'
    var compatRuntimeSet = compatRuntime.split(',').collect { it.trim() }
    if (compatRuntimeAll || compatRuntimeSet.contains('jei'))
    {
        modLocalRuntime "mezz.jei:jei-${jei_mc_version}-fabric:${jei_version}"
    }
    if (compatRuntimeAll || compatRuntimeSet.contains('emi'))
    {
        modLocalRuntime "dev.emi:emi-fabric:${emi_version}+${emi_mc_version}"
    }
    if (compatRuntimeAll || compatRuntimeSet.contains('rei'))
    {
        modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
        modLocalRuntime "dev.architectury:architectury-fabric:${architectury_version}"
        modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    }
    if (compatRuntimeAll || compatRuntimeSet.contains('jade'))
    {
        modLocalRuntime "maven.modrinth:jade:${jade_version}"
    }
    if (compatRuntimeSet.contains('sodium'))
    {
        modLocalRuntime "maven.modrinth:sodium:${sodium_version}"
        modLocalRuntime "maven.modrinth:indium:${indium_version}"
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            version: project.version
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
