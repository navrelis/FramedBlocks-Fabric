plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = mod_version
group = 'xfacthd.framedblocks'

base {
    archivesName = 'FramedBlocksFabric'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

loom {
    accessWidenerPath = file('src/main/resources/framedblocks_fabric.accesswidener')

    runs {
        // runClient only loads the main mod, this additionally loads the game test mod including the self-test and /fbtest commands
        clientDev {
            inherit client
            source 'gametest'
            ideConfigGenerated true
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'framedblocks_fabric_gametest'
        enableGameTests = true
        enableClientGameTests = false
    }
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }

    test {
        java {
            srcDirs = []
        }
        resources {
            srcDirs = []
        }
    }
}

repositories {
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'Fuzs Mod Resources'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        content {
            includeGroupByRegex('fuzs.*')
        }
    }
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup('mezz.jei')
            includeGroup('com.blamejared.searchables')
        }
    }
    maven {
        name = "Shedaniel's maven"
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroupAndSubgroups('me.shedaniel')
        }
    }
    maven {
        name = 'Architectury maven'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup('dev.architectury')
        }
    }
    maven {
        name = 'TerraformersMC maven'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup('dev.emi')
        }
    }
    maven {
        name = 'Team Resourceful maven'
        url = 'https://maven.teamresourceful.com/repository/maven-public/'
        content {
            includeGroupAndSubgroups('earth.terrarium')
            includeGroupAndSubgroups('com.teamresourceful')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth maven'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    include "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    // Optional integrations, none of these are required at runtime
    modCompileOnly "mezz.jei:jei-${jei_mc_version}-fabric-api:${jei_version}"

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}"

    modCompileOnly "dev.emi:emi-fabric:${emi_version}+${emi_mc_version}:api"

    modCompileOnly "maven.modrinth:jade:${jade_version}"

    modCompileOnly "earth.terrarium.athena:athena-fabric-${athena_mc_version}:${athena_version}"

    modCompileOnly("fuzs.diagonalblocks:diagonalblocks-fabric:${diag_blocks_version}") { transitive = false }

    modCompileOnly "maven.modrinth:amendments:${amendments_version}"

    modCompileOnly "com.blamejared.searchables:Searchables-fabric-${searchables_mc_version}:${searchables_version}"

    modCompileOnly "maven.modrinth:additional-placements-fabric:${additionalplacements_version}"

    modCompileOnly "maven.modrinth:atlasviewer:${atlasviewer_version}"

    modCompileOnly "teamreborn:energy:${team_reborn_energy_version}"

    // Only for the game tests of the Team Reborn Energy integration, never bundled or part of the main runtime
    modGametestImplementation "teamreborn:energy:${team_reborn_energy_version}"

    // Set compat_runtime=true to run JEI, EMI, REI and Jade in the dev client, or a comma-separated subset (e.g. jei,jade)
    var compatRuntime = findProperty('compat_runtime')?.toString()?.toLowerCase() ?: 'false'
    var compatRuntimeAll = compatRuntime == 'true'
    var compatRuntimeSet = compatRuntime.split(',').collect { it.trim() }
    if (compatRuntimeAll || compatRuntimeSet.contains('jei'))
    {
        modLocalRuntime "mezz.jei:jei-${jei_mc_version}-fabric:${jei_version}"
    }
    if (compatRuntimeAll || compatRuntimeSet.contains('emi'))
    {
        modLocalRuntime "dev.emi:emi-fabric:${emi_version}+${emi_mc_version}"
    }
    if (compatRuntimeAll || compatRuntimeSet.contains('rei'))
    {
        modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    }
    if (compatRuntimeAll || compatRuntimeSet.contains('jade'))
    {
        modLocalRuntime "maven.modrinth:jade:${jade_version}"
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            version: project.version
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
